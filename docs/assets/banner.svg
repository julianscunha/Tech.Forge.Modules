<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TechForge Modules — catálogo de módulos">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#3a1207"/>
    </linearGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- grade de módulos (catálogo), lado direito -->
  <circle cx="1000" cy="140" r="120" fill="url(#glow)"/>
  <g stroke="#fb923c" stroke-width="1.4" opacity="0.45" fill="none">
    <line x1="905" y1="95" x2="965" y2="95"/>
    <line x1="1005" y1="95" x2="1065" y2="95"/>
    <line x1="905" y1="160" x2="965" y2="160"/>
    <line x1="1005" y1="160" x2="1065" y2="160"/>
    <line x1="935" y1="120" x2="935" y2="135"/>
    <line x1="1035" y1="120" x2="1035" y2="135"/>
  </g>
  <g opacity="0.9">
    <rect x="875" y="70" width="60" height="50" rx="7" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="975" y="70" width="60" height="50" rx="7" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="875" y="135" width="60" height="50" rx="7" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="975" y="135" width="60" height="50" rx="7" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="1035" y="102" width="60" height="50" rx="7" fill="#1e293b" stroke="#f97316" stroke-width="2.5"/>
    <text x="1065" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#fde68a" text-anchor="middle">+</text>
  </g>

  <!-- título -->
  <text x="70" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">Tech<tspan fill="url(#ember)">Forge</tspan>.Modules</text>
  <text x="72" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">O catálogo oficial de módulos da plataforma TechForge</text>

  <rect x="72" y="174" width="460" height="3" rx="1.5" fill="url(#ember)"/>

  <text x="72" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Submeta · Empacote · Publique — um clique de instalação no Core</text>
</svg>
