service_id: system_information_service
description: System Information Service — informações de SO, CPU e runtime.
version: 1.0.0
dependencies: []
capabilities: [system.info.read, system.cpu.read, system.runtime.read, system.hardware.read, system.metrics.read, system.services.read, system.drivers.read, system.updates.read, system.services.manage]

exports:
  - name: apply_service_action
    description: >
      Para ou inicia um serviço Windows whitelisted (windows.SAFE_TO_MANAGE).
      Único export mutável do módulo — rejeita qualquer serviço fora da
      whitelist e retorna o start-type anterior para permitir revert.
    parameters:
      - name: name
        type: string
        required: true
      - name: action
        type: string
        required: true
        description: "'stop' ou 'start'"
    returns:
      type: ServiceActionResult
    examples:
      - "result = await apply_service_action('Fax', 'stop')"

  - name: get_windows_services
    description: Lista serviços do Windows (nome, status, tipo de início). Lista vazia fora do Windows.
    parameters: []
    returns:
      type: WindowsServiceList
    examples:
      - "result = await get_windows_services()"

  - name: get_windows_drivers
    description: Lista drivers assinados instalados (nome, fabricante, versão, data). Lista vazia fora do Windows.
    parameters: []
    returns:
      type: WindowsDriverList
    examples:
      - "result = await get_windows_drivers()"

  - name: get_windows_update_status
    description: Data do último hotfix instalado e contagem total de hotfixes.
    parameters: []
    returns:
      type: WindowsUpdateStatus
    examples:
      - "result = await get_windows_update_status()"

  - name: get_hardware_info
    description: Retorna inventário de hardware (CPU, RAM total, discos) — cross-platform via psutil.
    parameters: []
    returns:
      type: HardwareInfo
    examples:
      - "result = await get_hardware_info()"

  - name: get_live_metrics
    description: Retorna uma leitura pontual de uso (CPU%, RAM%, disco% por unidade) — nunca cacheada.
    parameters: []
    returns:
      type: LiveMetrics
    examples:
      - "result = await get_live_metrics()"
  - name: get_system_info
    description: Retorna informações gerais do sistema operacional e da máquina.
    parameters: []
    returns:
      type: SystemInfo
    examples:
      - "result = await get_system_info()"

  - name: get_cpu_info
    description: Retorna a contagem de núcleos lógicos de CPU.
    parameters: []
    returns:
      type: CpuInfo
    examples:
      - "result = await get_cpu_info()"

  - name: get_runtime_info
    description: Retorna informações do runtime Python que executa o Core.
    parameters: []
    returns:
      type: RuntimeInfo
    examples:
      - "result = await get_runtime_info()"

  - name: ping
    description: Health check endpoint.
    parameters: []
    returns:
      type: PingResult
    examples:
      - "GET /api/v1/modules/system_information_service/ping"
