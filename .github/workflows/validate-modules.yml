name: Validate modules

# Roda o MESMO validador do Core (techforge validate-module) contra todo
# módulo do catálogo, numa PR. Não reimplementa as regras aqui — instala
# a CLI real do repositório Tech.Forge, pra nunca dessincronizar do que
# o Core de fato exige.
#
# Falha (bloqueia o merge) só em erro real de estrutura/contrato/docs.
# Avisos (ex: pastas opcionais ausentes) não bloqueiam — mesmo
# comportamento de rodar `techforge validate-module` localmente sem
# `--strict`.
#
# Valida submissions/, não modules/: o contribuidor sobe a pasta-fonte solta
# em submissions/<id>/ (transitória); modules/<id>/ é gerenciada só pela CI
# (update-modules-readme.yml), guarda o .mod + index.json de cada versão já
# publicada, e nunca deve ser tocada num PR de contribuição.

on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Tech.Forge.Modules
        uses: actions/checkout@v4

      - name: Checkout Tech.Forge (fonte do validador real)
        uses: actions/checkout@v4
        with:
          repository: julianscunha/Tech.Forge
          path: _core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar techforge CLI
        run: pip install -e _core/cli

      - name: Instalar dependências do Core
        # A CLI importa app.module_engine.* incondicionalmente (não é
        # 100% standalone apesar do setup.py próprio) — sem isso, o
        # import da CLI falha com ModuleNotFoundError (pydantic_settings).
        run: pip install -r _core/core/backend/requirements.txt

      - name: Validar cada módulo submetido
        id: validate_modules
        run: |
          set -e
          status=0
          shopt -s nullglob
          for mod in submissions/*/; do
            echo "::group::Validando ${mod}"
            if ! techforge validate-module "$mod"; then
              echo "::error::Módulo inválido: ${mod}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Checagem extra de qualidade do manifest (description)
        if: always()
        run: python scripts/check_manifest_quality.py

      - name: Comentar preview do README na PR
        # Roda mesmo se a validação falhar (if: always()) — o contribuidor
        # vê o que teria aparecido no README de qualquer forma, ajuda a
        # diagnosticar. Só faz sentido em PR (workflow_dispatch não tem
        # PR pra comentar).
        if: always() && github.event_name == 'pull_request'
        run: |
          python scripts/preview_pr_modules.py > /tmp/preview.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/preview.md --edit-last || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/preview.md
