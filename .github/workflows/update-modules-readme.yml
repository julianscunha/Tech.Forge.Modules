name: Update modules README + Build catalog

# Depois de todo merge em main: regenera o README com a lista de modulos e
# reconstroi o catalogo oficial (index.json + .mod de cada modulo) dentro da
# propria pasta modules/. Depois de empacotar, a pasta-fonte de cada modulo
# (manifest.yaml + backend/ + frontend/) e removida — nao faz sentido quem
# clona o repositorio (ou o Marketplace, via GitHub Contents API) baixar
# centenas de milhares de pastas-fonte quando so o .mod importa pra
# instalacao. Pra atualizar um modulo, o autor reenvia a pasta-fonte
# completa numa nova PR; o merge reempacota e poda de novo.
#
# O Marketplace do TechForge le index.json + .mod via
# raw.githubusercontent.com — nenhuma outra automacao/setup e necessaria por
# parte de quem contribui um modulo (fluxo de PR nao muda).
#
# main e protegida (required status check "validate"), entao esta job nunca
# da push direto — abre um PR com o resultado e espera o proprio check
# "validate" passar (dispara pelo filtro pull_request de validate-modules.yml
# em qualquer PR que toque modules/**) antes de mergear via squash. Isso nao
# exige nenhuma excecao na protecao da branch nem habilitar auto-merge do
# GitHub — a job so espera e mergea ela mesma, como um humano faria.
#
# O merge da PR gerada por esta job (passo "Publish catalog changes via PR")
# tambem apaga manifest.yaml ao podar a fonte, entao bate de novo no filtro
# de path abaixo e dispararia a si mesma em loop. Como o merge usa um PAT
# pessoal (nao o GITHUB_TOKEN — GitHub bloqueia Actions de criar/aprovar
# PRs), o `github.actor` do push resultante e a pessoa dona do PAT, nao
# "github-actions[bot]" — checar actor nao detecta esse caso. Em vez disso,
# o guard checa a mensagem do commit (toda PR gerada por esta job carrega
# "[automatico]" no titulo/commit, ver step final).

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "scripts/generate_modules_readme.py"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    if: "!contains(github.event.head_commit.message, '[automatico]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Tech.Forge.Modules
        uses: actions/checkout@v4

      - name: Checkout Tech.Forge (fonte do techforge CLI)
        uses: actions/checkout@v4
        with:
          repository: julianscunha/Tech.Forge
          path: _core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Instalar techforge CLI
        run: pip install -e _core/cli

      - name: Instalar dependencias do Core
        # A CLI importa app.module_engine.* incondicionalmente — sem isso o
        # import falha com ModuleNotFoundError (pydantic_settings).
        run: pip install -r _core/core/backend/requirements.txt

      - name: Generate module list
        run: python scripts/generate_modules_readme.py

      - name: Build catalog (index.json + .mod)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: techforge catalog build-index modules --output modules

      - name: Prune source folders already packaged
        run: python scripts/prune_packaged_sources.py

      - name: Publish catalog changes via PR
        env:
          # GITHUB_TOKEN cannot create/approve PRs (GitHub's own anti
          # supply-chain-abuse restriction) — a fine-grained PAT scoped to
          # just this repo (contents + pull_requests) is required for
          # `gh pr create`/`gh pr merge` below. The branch push itself still
          # uses the default GITHUB_TOKEN (contents:write is enough for that).
          GH_TOKEN: ${{ secrets.CATALOG_BOT_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md modules/
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping."
            exit 0
          fi

          BRANCH="catalog-build/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: atualiza README e catalogo (index.json + .mod) [automatico]"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: atualiza catalogo (index.json + .mod) [automatico]" \
            --body "Gerado automaticamente apos merge em main: empacota modulos novos/atualizados em .mod, regenera index.json e remove pastas-fonte ja empacotadas." \
            --base main --head "$BRANCH")
          echo "PR aberto: $PR_URL"

          gh pr checks "$PR_URL" --watch --interval 5 --fail-fast
          gh pr merge "$PR_URL" --squash --delete-branch
